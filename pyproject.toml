[project]
name = "mapgenerator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "angelou6", email = "68724210+angelou6@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
reportAny = false

[tool.ruff]
line-length = 88

[project.scripts]
map = "mapgenerator.main:main"
tacobell = "mapgenerator.tacobell:main" # Pruebas random
game = "game.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
